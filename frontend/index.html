<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover - Music Creation Game</title>
    <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
    <div id="app">
        <!-- Lobby Phase -->
        <div id="lobby-content" class="phase-container">
            <h1>Discover</h1>
            <div id="lobby-content">
                <!-- JavaScript will populate this -->
            </div>
        </div>

        <!-- Creation Phase -->
        <div id="creation-container" class="phase-container" style="display: none;">
            <h2>Create Your Track</h2>
            <div id="creation-content">
                <!-- JavaScript will populate this -->
            </div>
        </div>

        <!-- Listening Phase -->
        <div id="listening-container" class="phase-container" style="display: none;">
            <h2>Listen to Tracks</h2>
            <div id="listening-content">
                <!-- JavaScript will populate this -->
            </div>
        </div>

        <!-- Selection Phase -->
        <div id="selection-container" class="phase-container" style="display: none;">
            <h2>Vote for Your Favorite</h2>
            <div id="selection-content">
                <!-- JavaScript will populate this -->
            </div>
        </div>

        <!-- Results Phase -->
        <div id="results-container" class="phase-container" style="display: none;">
            <h2>Results</h2>
            <div id="results-content">
                <!-- JavaScript will populate this -->
            </div>
        </div>
    </div>

    <!-- Load main TypeScript file -->
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
